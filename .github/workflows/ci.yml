name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Compilation is most of this job; the tests themselves are dominated by
      # Argon2, which no cache can help with (D9 -- it is meant to be expensive).
      # Keyed on the toolchain and Cargo.lock, so a dependency change misses.
      - uses: Swatinem/rust-cache@v2

      - name: format
        run: cargo fmt --all --check

      # Lint policy lives in the workspace Cargo.toml. `unwrap`, `expect` and
      # `panic` are denied in every crate; this is the gate that enforces it.
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --workspace

  # The MSRV in Cargo.toml is a claim. This is what makes it true.
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.88.0

      # Its own cache: a different rustc produces different artifacts, and the
      # key includes the toolchain, so this never collides with `check`.
      - uses: Swatinem/rust-cache@v2

      - run: cargo build --workspace

  # Architectural boundaries from architecture §34.1 are load-bearing, not
  # stylistic: if tokio reaches the object model, validation stops being
  # reproducible and fuzzable. Nothing but this check enforces that.
  layering:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/check-layering.sh

  # Supply chain: known advisories, licence obligations, and where crates come
  # from. Policy lives in deny.toml; adding a licence there is a decision.
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Every object arrives from somewhere untrusted (§29). A short run on each
  # push is a smoke test, not a campaign -- it catches the obvious regression,
  # and longer runs belong on a schedule.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked

      # `+nightly` is not decoration. `rust-toolchain.toml` pins the whole tree
      # to a stable release, and rustup honours that file over whatever the
      # toolchain action installed -- so without the override rustc rejects
      # `-Zsanitizer=address` and the job dies before trying a single input.
      # It did exactly that on every push from M3 until this was fixed.
      - run: cargo +nightly fuzz run object_decode -- -max_total_time=60
        working-directory: fuzz
      - run: cargo +nightly fuzz run canonical_roundtrip -- -max_total_time=60
        working-directory: fuzz
      - run: cargo +nightly fuzz run frame_decode -- -max_total_time=60
        working-directory: fuzz
      - run: cargo +nightly fuzz run session_drive -- -max_total_time=60
        working-directory: fuzz
      - run: cargo +nightly fuzz run bundle_decode -- -max_total_time=60
        working-directory: fuzz
