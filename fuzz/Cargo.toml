[package]
name = "pigeonnet-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# Deliberately outside the main workspace: the fuzz harness needs nightly and
# libfuzzer, and should not drag either into an ordinary `cargo build`.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pigeonnet-core = { path = "../crates/pigeonnet-core" }
pigeonnet-proto = { path = "../crates/pigeonnet-proto" }
pigeonnet-bundle = { path = "../crates/pigeonnet-bundle" }

[[bin]]
name = "object_decode"
path = "fuzz_targets/object_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "canonical_roundtrip"
path = "fuzz_targets/canonical_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "session_drive"
path = "fuzz_targets/session_drive.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bundle_decode"
path = "fuzz_targets/bundle_decode.rs"
test = false
doc = false
bench = false
